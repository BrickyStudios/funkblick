name: Update camera data

# Every Monday: speed cameras, traffic cameras, number plate scanners and counters for all of Germany, fresh from
# OpenStreetMap. The app downloads the two files once a week (Store.refreshCameraData), so no release is needed.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write # commit the new files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Speed cameras
        continue-on-error: true # a busy Overpass server: keep last week's file
        run: python3 tools/build_speedcams.py

      - name: Traffic cameras and counters
        continue-on-error: true
        run: python3 tools/build_speedcams.py traffic

      - name: Commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/speedcams.tsv app/src/main/assets/trafficcams.tsv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Daten: Blitzer und Verkehrskameras aus OpenStreetMap aktualisiert"
          git push
